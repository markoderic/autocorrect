name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: swift test --build-system native
      - name: Build universal app
        run: scripts/build.sh
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: AutoCorrect-universal
          path: |
            dist/AutoCorrect-*-universal.zip
            dist/AutoCorrect-*-universal.zip.sha256
          if-no-files-found: error
